<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- WeldCheck mark: electrode meeting a weld bead, spark at the joint -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="#16233A"/>
  <!-- plate line -->
  <path d="M7 46h50" stroke="#31415E" stroke-width="3" stroke-linecap="round"/>
  <!-- weld bead ripples, separated so they read as a bead at small sizes -->
  <g fill="#E9E4D8" stroke="#16233A" stroke-width="2">
    <circle cx="13" cy="43" r="6.5"/>
    <circle cx="22" cy="43" r="6.5"/>
    <circle cx="31" cy="43" r="6.5"/>
  </g>
  <!-- electrode -->
  <path d="M55 9 44 25" stroke="#C7D0DE" stroke-width="5.5" stroke-linecap="round"/>
  <path d="M57 6l-3 4.5" stroke="#EA580C" stroke-width="7" stroke-linecap="round"/>
  <!-- spark glow + burst -->
  <circle cx="41" cy="33" r="11" fill="#EA580C" opacity=".26"/>
  <path d="M41 21 44.2 29.8 53 33 44.2 36.2 41 45 37.8 36.2 29 33 37.8 29.8 Z" fill="#EA580C"/>
  <circle cx="41" cy="33" r="3" fill="#FFD9BF"/>
</svg>
