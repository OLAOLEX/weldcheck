<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Pre-weld checklist · WeldCheck</title><link rel="icon" href="favicon.svg"/><link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/><link rel="stylesheet" href="assets/weldcheck.css"/></head><body class="sel-body">
<header class="sel-header"><div class="sel-wrap sel-header__bar"><a class="sel-logo" href="/"><span class="sel-logo__mark"><img src="assets/logo.svg" alt=""/></span><span class="sel-logo__text"><span class="sel-logo__brand">WeldCheck</span><span class="sel-logo__sub">SMAW inspection</span></span></a><nav class="wc-topnav"><a href="/new-job"><svg class="ic"><use href="#i-plus"></use></svg><span class="wc-navlabel">New job</span></a><a href="/history"><svg class="ic"><use href="#i-history"></use></svg><span class="wc-navlabel">History</span></a><button class="sel-theme" id="themeBtn"><svg class="ic"><use href="#i-moon"></use></svg></button></nav></div></header>
<main class="sel-main sel-section"><div class="sel-narrow" id="page" hidden><span class="sel-steps">Step 2 of 3 · Pre-weld checklist</span><h1>Confirm each step</h1><p>Tap each preparation item when it is done. Progress saves as you work.</p><div class="wc-jobstrip" id="jobStrip"></div><div class="sel-card"><div class="sel-progress"><div class="sel-progress__fill" id="progFill"></div></div><div class="sel-progress__meta"><span id="progText"></span><span>Before welding</span></div><div id="checkList" style="margin-top:16px"></div></div><div class="sel-note sel-note--warn" id="pendingNote" hidden style="margin-top:18px"><svg class="ic"><use href="#i-alert"></use></svg><span>Complete the remaining preparation checks before continuing.</span></div><button class="sel-btn sel-btn--primary sel-btn--lg sel-btn--block" id="nextBtn" style="margin-top:18px">Continue to weld photo <svg class="ic"><use href="#i-arrow-right"></use></svg></button></div><div class="sel-narrow" id="missing" hidden><div class="sel-empty"><h2>Job not found</h2><a class="sel-btn sel-btn--primary" href="/new-job">Start a new job</a></div></div></main>
<footer class="sel-footer"><div class="sel-wrap">WeldCheck · <span data-year></span></div></footer>
<script src="assets/sprite.js"></script><script src="assets/db.js"></script><script src="assets/cloud.js"></script><script src="assets/data.js"></script><script src="assets/app.js"></script><script src="assets/auth.js"></script><script src="assets/fx.js"></script>
<script>(function(){var id=Wc.param("job"),job;function row(item){var done=!!(job.checks&&job.checks[item.key]);return '<button type="button" class="wc-check'+(done?' is-done':'')+'" data-key="'+item.key+'"><span class="wc-check__box"><svg class="ic"><use href="#i-check"></use></svg></span><span class="wc-check__txt">'+Wc.esc(item.text)+'</span><span class="wc-check__state">'+(done?'Done':'Pending')+'</span></button>';}function progress(){var n=Wc.doneCount(job),pct=Math.round(n/Wc.CHECKLIST.length*100);Wc.$("progText").textContent=n+" of "+Wc.CHECKLIST.length+" done";WcFx.progressTo(Wc.$("progFill"),pct);Wc.$("pendingNote").hidden=n===Wc.CHECKLIST.length;}function render(){Wc.$("jobStrip").innerHTML='<div class="wc-jobstrip__ic"><svg class="ic"><use href="#i-file-text"></use></svg></div><div class="wc-jobstrip__t"><div class="wc-jobstrip__name">Sample '+Wc.esc(job.sampleNo)+(job.jobName?' · '+Wc.esc(job.jobName):'')+'</div><div class="wc-jobstrip__meta">'+Wc.esc(job.jointType)+' · '+Wc.esc(job.electrodeClassification)+' '+Wc.esc(job.electrodeSize)+' mm · '+Wc.esc(job.currentAmp)+' A</div></div>';Wc.$("checkList").innerHTML=Wc.CHECKLIST.map(row).join("");Wc.$("checkList").querySelectorAll(".wc-check").forEach(function(btn){btn.onclick=function(){job.checks=job.checks||{};job.checks[this.dataset.key]=!job.checks[this.dataset.key];job.status=Wc.doneCount(job)===Wc.CHECKLIST.length?"checklist_complete":"draft";WcData.putJob(job);render();};});progress();Wc.$("page").hidden=false;}Wc.$("nextBtn").onclick=function(){if(Wc.doneCount(job)!==Wc.CHECKLIST.length){Wc.$("pendingNote").hidden=false;Wc.toast("Finish all nine checks before continuing.");return;}job.status="checklist_complete";WcData.putJob(job).then(function(){location.href="/upload?job="+job.id;});};WcData.getJob(id).then(function(j){if(!j){Wc.$("missing").hidden=false;return;}job=j;render();});})();</script></body></html>
