name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: for file in api/*.js assets/*.js; do node --check "$file"; done
      - name: Check Python syntax
        run: python3 -m py_compile dev-server.py
      - name: Check required public files
        run: test -f LICENSE && test -f SECURITY.md && test -f CONTRIBUTING.md && test -f .env.example
