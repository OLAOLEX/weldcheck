name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: for file in api/*.js assets/*.js; do node --check "$file"; done
      - name: Test learning-cycle rules
        run: node tests/learning.test.js
      - name: Test workflows and exercise library
        run: node tests/workflows.test.js
      - name: Test reference comparison rules
        run: node tests/comparison.test.js
      - name: Test authentication onboarding rules
        run: node tests/auth.test.js
      - name: Test project alignment rules
        run: node tests/alignment.test.js
      - name: Check Python syntax
        run: python3 -m py_compile dev-server.py
      - name: Check required public files
        run: test -f LICENSE && test -f SECURITY.md && test -f CONTRIBUTING.md && test -f .env.example
